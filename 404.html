<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Martin Romero Studio</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0e1217">
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dark:#0e1217;--dark-ink:#eceff3;--dark-muted:#8b95a2;--dark-line:#222a35;--accent:#3d6bc4;--accent-light:#7fb2e8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--dark);color:var(--dark-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;position:relative;overflow:hidden;}
body::before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:64px 64px;pointer-events:none;}
body::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom left,rgba(61,107,196,0.20) 0%,rgba(61,107,196,0.07) 32%,rgba(61,107,196,0.02) 58%,rgba(14,18,23,0) 80%);pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:520px;}
.logo{margin-bottom:2.5rem;display:flex;justify-content:center;align-items:center;gap:0.55rem;}
.logo .fb{display:flex;flex-direction:column;line-height:1.05;text-align:left;}
.logo .fb-name{font-size:0.95rem;font-weight:600;letter-spacing:-0.02em;color:#eceff3;}
.logo .fb-sub{font-family:'Spline Sans Mono',monospace;font-size:0.55rem;letter-spacing:0.34em;color:#7fb2e8;}
.code{font-family:'Spline Sans Mono',monospace;font-size:clamp(4.5rem,18vw,8rem);font-weight:500;line-height:1;color:var(--accent-light);letter-spacing:0.02em;}
.titulo{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:600;letter-spacing:-0.03em;line-height:1.15;margin-bottom:0.75rem;}
.titulo .hl{color:var(--accent-light);}
.subtitulo{font-size:0.95rem;color:var(--dark-muted);font-weight:400;line-height:1.7;margin-bottom:2rem;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--accent-light);color:var(--dark);padding:0.85rem 1.75rem;border-radius:7px;font-size:0.85rem;font-weight:600;text-decoration:none;transition:all 0.25s;}
.btn:hover{background:#fff;transform:translateY(-2px);}
.ornament{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1rem;}
.orn-line{width:20px;height:1px;background:var(--accent-light);}
.orn-dot{width:4px;height:4px;border-radius:50%;background:var(--accent-light);}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">
<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Martin Romero Studio"><rect width="30" height="30" rx="7" fill="#3d6bc4"/><rect x="7" y="8" width="16" height="3" fill="#fff"/><rect x="7" y="8" width="3.5" height="14" fill="#fff"/><rect x="19.5" y="8" width="3.5" height="14" fill="#fff"/><rect x="13.25" y="8" width="3.5" height="8" fill="#fff"/></svg>
<span class="fb"><span class="fb-name">Martin Romero</span><span class="fb-sub">STUDIO</span></span>
</div>
<div class="code">404</div>
<div class="ornament"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line"></div></div>
<h1 class="titulo">Esta página <span class="hl">no existe</span></h1>
<p class="subtitulo">Puede que el enlace esté roto o que la página se haya movido. Volvé al inicio y seguimos.</p>
<a href="/" class="btn">Volver al inicio →</a>
</div>
</body>
</html>
