:root{--negro:#1c1c1a;--acento:#c8a96e;--crema:#f7f2ea;--gris:#6b6b68;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--crema);color:var(--negro);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;position:relative;overflow:hidden;}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 80% 20%,rgba(200,169,110,0.1) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 10% 80%,rgba(74,124,89,0.07) 0%,transparent 55%);pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:520px;}
.logo{margin-bottom:2.5rem;}
.code{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,18vw,8rem);font-weight:700;line-height:1;color:var(--acento);}
.titulo{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;line-height:1.15;margin-bottom:0.75rem;}
.titulo em{font-style:italic;color:var(--acento);}
.subtitulo{font-size:0.95rem;color:var(--gris);font-weight:300;line-height:1.7;margin-bottom:2rem;}
.btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--negro);color:white;padding:0.85rem 1.75rem;border-radius:8px;font-size:0.85rem;font-weight:500;text-decoration:none;transition:all 0.25s;}
.btn:hover{background:var(--acento);color:var(--negro);transform:translateY(-2px);}
.ornament{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1rem;}
.orn-line{width:20px;height:1px;background:var(--acento);}
.orn-dot{width:4px;height:4px;border-radius:50%;background:var(--acento);}
</style>
