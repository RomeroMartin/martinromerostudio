<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias! · Martin Romero Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e1217">
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#0e1217;
    --surface:#161b22;
    --dark-ink:#eceff3;
    --dark-muted:#8b95a2;
    --dark-line:#222a35;
    --accent:#3d6bc4;
    --accent-light:#7fb2e8;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Archivo', system-ui, sans-serif;
    background: var(--dark);
    color: var(--dark-ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }
  /* Fondo: grilla + degradé */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#ffffff0a 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom left,
      rgba(61,107,196,0.20) 0%, rgba(61,107,196,0.07) 32%,
      rgba(61,107,196,0.02) 58%, rgba(14,18,23,0) 80%);
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 520px;
    width: 100%;
    text-align: center;
    padding: 3.5rem 2.5rem;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--dark-line);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }
  .logo { margin-bottom: 2rem; display: flex; justify-content: center; }
  /* Ícono check */
  .check-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(127,178,232,0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.75rem;
    animation: popIn 0.5s 0.2s ease both;
  }
  .check-circle svg { width: 32px; height: 32px; fill: none; stroke: var(--accent-light); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
  .titulo {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 0.75rem;
    animation: fadeUp 0.6s 0.3s ease both;
  }
  .titulo .hl { color: var(--accent-light); }
  .subtitulo {
    font-size: 0.95rem;
    color: var(--dark-muted);
    font-weight: 400;
    line-height: 1.7;
    margin-bottom: 2rem;
    animation: fadeUp 0.6s 0.4s ease both;
  }
  /* Barra de progreso */
  .progress-wrap {
    margin-bottom: 1.5rem;
    animation: fadeUp 0.6s 0.5s ease both;
  }
  .progress-label {
    font-family: 'Spline Sans Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--dark-muted);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .progress-bar-bg {
    height: 4px;
    background: var(--dark-line);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent-light);
    border-radius: 99px;
    width: 0%;
    transition: width 0.1s linear;
  }
  /* Botón */
  .btn-volver {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--accent-light);
    color: var(--dark);
    padding: 0.8rem 1.75rem;
    border-radius: 7px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.25s;
    animation: fadeUp 0.6s 0.5s ease both;
    border: none;
    cursor: pointer;
    font-family: 'Archivo', system-ui, sans-serif;
  }
  .btn-volver:hover { background: #fff; transform: translateY(-2px); }
  /* Ornamento */
  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 0.5rem;
  }
  .orn-line { width: 20px; height: 1px; background: var(--accent-light); }
  .orn-dot  { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-light); }
  .firma {
    margin-top: 2rem;
    font-family: 'Spline Sans Mono', monospace;
    font-size: 0.7rem;
    color: var(--dark-muted);
    letter-spacing: 0.02em;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="card">

  <div class="logo">
    <svg width="200" height="34" viewBox="0 0 240 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Martin Romero Studio">
      <g><rect x="0" y="5" width="30" height="30" rx="7" fill="#3d6bc4"/><rect x="7" y="13" width="16" height="3" fill="#fff"/><rect x="7" y="13" width="3.5" height="14" fill="#fff"/><rect x="19.5" y="13" width="3.5" height="14" fill="#fff"/><rect x="13.25" y="13" width="3.5" height="8" fill="#fff"/></g>
      <text x="40" y="19" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="-0.3" fill="#eceff3">Martin Romero</text>
      <text x="40" y="31" font-family="'Spline Sans Mono', ui-monospace, monospace" font-size="8" letter-spacing="2.9" fill="#7fb2e8">STUDIO</text>
    </svg>
  </div>

  <div class="check-circle">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 16l7 7 13-13"/>
    </svg>
  </div>

  <div class="ornament">
    <div class="orn-line"></div>
    <div class="orn-dot"></div>
    <div class="orn-line"></div>
  </div>

  <h1 class="titulo">¡Gracias por<br>confiar en <span class="hl">nosotros</span>!</h1>

  <p class="subtitulo">
    Tu pago fue recibido con éxito.<br>
    Me estaré poniendo en contacto a la brevedad para coordinar los próximos pasos.
  </p>

  <div class="progress-wrap">
    <p class="progress-label">Volviendo al sitio en <span id="seg">20</span> segundos...</p>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="barra"></div>
    </div>
  </div>

  <button class="btn-volver" onclick="irAlInicio()">Volver al sitio ahora →</button>

  <p class="firma">— Martin Romero Studio · martinromerostudio.com.ar</p>

</div>

<script>
  const TOTAL = 20;
  let remaining = TOTAL;
  const segEl = document.getElementById('seg');
  const barra = document.getElementById('barra');

  function irAlInicio() {
    window.location.href = 'index.html';
  }

  const interval = setInterval(() => {
    remaining -= 0.1;
    const pct = ((TOTAL - remaining) / TOTAL) * 100;
    barra.style.width = pct + '%';
    segEl.textContent = Math.ceil(remaining);
    if (remaining <= 0) {
      clearInterval(interval);
      irAlInicio();
    }
  }, 100);
</script>

</body>
</html>
